name: Verificações
# Em branches de trabalho, testar somente o PR para evitar execução dupla.
# Sem PR aberto, use workflow_dispatch para testar manualmente.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar tipos
        run: npm run check
      - name: Gerar site estático
        run: npm run build
      - name: Testar API dos contadores
        run: npm run test:api
      - name: Instalar Chromium de testes
        run: npx playwright install --with-deps chromium
      - name: Testar experiência real no navegador
        run: npm run test:e2e
      - name: Armazenar evidências de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oldarcade-test-evidence
          path: test-results/
          if-no-files-found: ignore
      - name: Preparar pacote de Preview do site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oldarcade-preview
          path: dist/
          retention-days: 14
